<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K1KFX · Fox Hunts</title>
  <meta name="description" content="K1KFX — amateur radio fox hunts in Lincoln, Nebraska.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1412;
      --ink: #f2efe6;
      --muted: #9aa69f;
      --accent: #ff6a1a;
      --accent-ink: #120a05;
      --line: #26302b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 16px;
      background-image:
        radial-gradient(circle at 50% 42%, transparent 0 120px, var(--line) 121px, transparent 122px),
        radial-gradient(circle at 50% 42%, transparent 0 220px, var(--line) 221px, transparent 222px),
        radial-gradient(circle at 50% 42%, transparent 0 330px, var(--line) 331px, transparent 332px);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
      padding: 48px 0;
    }
    .tag {
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(64px, 18vw, 160px);
      line-height: 0.9;
      letter-spacing: -0.02em;
    }
    p.lede {
      max-width: 34ch;
      font-size: 17px;
      line-height: 1.55;
      color: var(--muted);
    }
    a.join {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      text-transform: uppercase;
      text-decoration: none;
      padding: 22px 44px;
      border-radius: 6px;
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    a.join:hover, a.join:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent), 0 12px 32px rgba(255,106,26,0.35);
      outline: none;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 24px 0;
      border-top: 1px solid var(--line);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="tag">Amateur Radio · Lincoln, NE · EN10</div>
    <h1>K1KFX</h1>
    <p class="lede">Radio direction finding in the field. Grab a receiver, find the fox.</p>
    <a class="join" href="hunt/">Join a Hunt →</a>
  </main>
  <footer>
    K1KFX · <a href="https://www.qrz.com/db/K1KFX">QRZ</a>
  </footer>
</body>
</html>
