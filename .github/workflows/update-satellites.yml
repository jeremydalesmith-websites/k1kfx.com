# Keeps the Satellite Pass Planner's data fresh. That is ALL this does.
#
# Four times a day (and whenever "Run workflow" is pressed in the Actions tab) it downloads the Keplers and the AMSAT
# status reports with the planner's own script, checks them, and commits exactly two files:
#     satellites/data/elements.json
#     satellites/data/status.json
# If a download or the check fails, nothing is committed and the data already on the site stays as it is.
# It never touches the planner app itself, hunt/, or anything else on the website.
# The app is published separately, by hand (publish.bat in the planner folder, then GitHub Desktop).

name: Update satellites

on:
  schedule:
    - cron: '17 3,9,15,21 * * *' # 03:17, 09:17, 15:17 and 21:17 UTC; GitHub may start a run late or skip one
  workflow_dispatch: {} # the manual "Run workflow" button

concurrency:
  group: update-satellites
  cancel-in-progress: false

permissions:
  contents: write # commit the two data files to this repository; nothing else

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out the planner (public; only its download and check scripts are used)
        uses: actions/checkout@v4
        with:
          repository: jeremydalesmith-websites/satellite-planning
          ref: main
          path: planner
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download fresh data and check it (any failure stops here; nothing is published)
        working-directory: planner
        run: |
          node scripts/refresh-data.ts --strict --deadline-min 6
          node scripts/validate-data.ts

      - name: Commit only the two data files
        working-directory: site
        run: |
          cp ../planner/public/data/elements.json ../planner/public/data/status.json satellites/data/
          git add satellites/data/elements.json satellites/data/status.json
          if [ -n "$(git diff --cached --name-only | grep -v -x -e satellites/data/elements.json -e satellites/data/status.json)" ]; then
            echo "::error::Refusing to commit: something other than the two data files is staged."
            exit 1
          fi
          if git diff --cached --quiet; then echo "No change to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update satellite data (automated)"
          git pull --rebase origin main
          git push origin HEAD:main
